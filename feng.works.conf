server {
    listen [::]:80;
    listen 80;
    server_name feng.works www.feng.works;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name feng.works www.feng.works;
    
    ssl_certificate /etc/nginx/ssl/tigerfeng.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/tigerfeng.cn.priv.key;

    root /var/www/feng.works/public_html;
    index index.html;

    include /etc/nginx/mime.types;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    # Handle JavaScript files specifically
    location ~* \.js$ {
        root /var/www/feng.works/public_html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/javascript" always;
        try_files $uri =404;
    }

    # Handle CSS files
    location ~* \.css$ {
        root /var/www/feng.works/public_html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Handle other static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|webm|mp4|woff|woff2|ttf|eot)$ {
        root /var/www/feng.works/public_html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Handle all other requests (SPA routing)
    location / {
        root /var/www/feng.works/public_html;
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /errors/404.html;
    location = /errors/40x.html {
        root /var/www/feng.works/public_html;
    }

    error_page 500 502 503 504 /errors/50x.html;
    location = /errors/50x.html {
        root /var/www/feng.works/public_html;
    }
} 