server {
    listen 80;
    listen [::]:80;
    server_name feng.works www.feng.works;
    
    # Path to your built files
    root /Users/yicheng-feng/Documents/website-v2/dist;
    index index.html;

    # Include MIME types
    include /etc/nginx/mime.types;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    # Handle JavaScript files specifically with correct MIME type
    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/javascript" always;
        try_files $uri =404;
    }

    # Handle CSS files
    location ~* \.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "text/css" always;
        try_files $uri =404;
    }

    # Handle other static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|webm|mp4|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Handle all other requests (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
} 